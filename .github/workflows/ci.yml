name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-only dummy — lib/auth.ts throws at module load if this is
      # unset, and Next's build step loads every route module (even the
      # dynamic ones that never actually sign anything at build time) to
      # collect page data. Never used to sign a real session anywhere.
      SESSION_SECRET: ci-build-only-secret-not-used-for-real-sessions
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
